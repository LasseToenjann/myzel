<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MYZEL — Das stille Netz</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23081310%27/%3E%3Cg stroke=%27%234fe0a0%27 stroke-width=%272%27 stroke-linecap=%27round%27 fill=%27none%27%3E%3Cpath d=%27M16 28V15%27/%3E%3Cpath d=%27M16 19L9 13%27/%3E%3Cpath d=%27M16 19l7-6%27/%3E%3Cpath d=%27M16 15l-4-6%27/%3E%3Cpath d=%27M16 15l4-6%27/%3E%3C/g%3E%3Cg fill=%27%23a6e85c%27%3E%3Ccircle cx=%2716%27 cy=%2715%27 r=%272.6%27/%3E%3Ccircle cx=%279%27 cy=%2713%27 r=%271.9%27/%3E%3Ccircle cx=%2723%27 cy=%2713%27 r=%271.9%27/%3E%3Ccircle cx=%2712%27 cy=%279%27 r=%271.7%27/%3E%3Ccircle cx=%2720%27 cy=%279%27 r=%271.7%27/%3E%3C/g%3E%3C/svg%3E">
<meta name="description" content="MYZEL - ein entspanntes Incremental-Game ueber ein Pilzgeflecht unter dem Waldboden.">
<meta name="google-site-verification" content="r995RFEp1Kif3h2Dq9Ru5ifNSIuzQ8CJ_m3xXYE5SMM" />
<meta name="theme-color" content="#050a08">
<link rel="stylesheet" href="css/style.css?v=1.0.8">
</head>
<body>

<canvas id="fx-net"></canvas>
<canvas id="fx-particles"></canvas>
<div id="vignette"></div>

<!-- ============ STARTBILDSCHIRM ============ -->
<div id="start-screen">
  <div class="start-inner">
    <div class="logo-wrap">
      <svg class="logo-mark" viewBox="0 0 120 120" aria-hidden="true">
        <g class="logo-net" fill="none" stroke-linecap="round">
          <path d="M60 108 L60 66"/><path d="M60 78 L34 58"/><path d="M60 78 L86 58"/>
          <path d="M60 66 L42 44"/><path d="M60 66 L78 44"/>
          <path d="M34 58 L22 40"/><path d="M86 58 L98 40"/>
          <path d="M42 44 L34 26"/><path d="M42 44 L52 28"/>
          <path d="M78 44 L86 26"/><path d="M78 44 L68 28"/>
        </g>
        <g class="logo-dots">
          <circle cx="60" cy="66" r="4"/><circle cx="34" cy="58" r="3"/><circle cx="86" cy="58" r="3"/>
          <circle cx="42" cy="44" r="3"/><circle cx="78" cy="44" r="3"/>
          <circle cx="22" cy="40" r="2.2"/><circle cx="98" cy="40" r="2.2"/>
          <circle cx="34" cy="26" r="2.2"/><circle cx="52" cy="28" r="2.2"/>
          <circle cx="86" cy="26" r="2.2"/><circle cx="68" cy="28" r="2.2"/>
        </g>
      </svg>
      <h1 class="title">MYZEL</h1>
      <p class="subtitle">Das stille Netz</p>
    </div>

    <div class="start-menu">
      <button id="btn-continue" class="btn btn-primary big hidden">Weiterwachsen</button>
      <button id="btn-new" class="btn big">Neues Myzel</button>
      <button id="btn-import-start" class="btn">Spielstand laden</button>
      <button id="btn-board-start" class="btn">Bestenliste</button>
      <button id="btn-about" class="btn ghost">Über das Spiel</button>
    </div>
    <div id="start-save-info" class="save-info"></div>
    <div class="start-foot">Ein entspanntes Incremental. Alles wird lokal gespeichert.</div>
  </div>
</div>

<!-- ============ SPIEL ============ -->
<div id="game" class="hidden">

  <header id="topbar">
    <div class="res res-main">
      <div class="res-val" id="t-biomass">0</div>
      <div class="res-lbl">Biomasse <span id="t-rate" class="rate">+0 /s</span></div>
    </div>

    <div class="res level-res">
      <div class="res-val"><span id="t-level">0</span> <span class="unit">Reifegrad</span></div>
      <div class="xpbar"><div class="xpbar-fill" id="t-xpfill"></div><span class="xpbar-txt" id="t-xptxt"></span></div>
    </div>

    <div class="res res-wp" id="t-wp-wrap">
      <div class="res-val" id="t-wp">0</div>
      <div class="res-lbl">Wachstumspunkte</div>
    </div>

    <div class="res res-spore hidden" id="t-spore-wrap">
      <div class="res-val" id="t-spore">0</div>
      <div class="res-lbl">Sporen</div>
    </div>

    <div class="res res-sp hidden" id="t-sp-wrap">
      <div class="res-val" id="t-sp">0</div>
      <div class="res-lbl">Symbiose</div>
    </div>

    <div class="top-right">
      <button class="icon-btn" id="btn-sound" title="Ton">♪</button>
      <button class="icon-btn" id="btn-menu" title="Menü">☰</button>
    </div>
  </header>

  <nav id="tabs"></nav>

  <main id="content">
    <section class="tab-panel" data-tab="netz"></section>
    <section class="tab-panel" data-tab="baum"></section>
    <section class="tab-panel" data-tab="sporen"></section>
    <section class="tab-panel" data-tab="symbiose"></section>
    <section class="tab-panel" data-tab="pruefung"></section>
    <section class="tab-panel" data-tab="erfolge"></section>
    <section class="tab-panel" data-tab="statistik"></section>
    <section class="tab-panel" data-tab="optionen"></section>
  </main>

  <div id="toasts"></div>
</div>

<div id="modal-root"></div>
<div id="flash"></div>

<script src="js/util.js?v=1.0.8"></script>
<script src="js/data.js?v=1.0.8"></script>
<script src="js/state.js?v=1.0.8"></script>
<script src="js/engine.js?v=1.0.8"></script>
<script src="js/fx.js?v=1.0.8"></script>
<script src="js/leaderboard.js?v=1.0.8"></script>
<script src="js/ui.js?v=1.0.8"></script>
<script src="js/main.js?v=1.0.8"></script>
</body>
</html>
